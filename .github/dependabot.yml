version: 2
updates:
  - package-ecosystem: 'npm'
    schedule:
      interval: 'weekly'
    directories:
      - '/'
    groups:
      astro-dependencies:
        patterns:
          - 'astro'
          - '@astrojs/*'
      react-dependencies:
        patterns:
          - 'react*'
      # Security fixes land as one PR instead of one per package
      security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
