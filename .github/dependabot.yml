version: 2
updates:
  - package-ecosystem: 'npm'
    schedule:
      interval: 'weekly'
    directories:
      - '/'
    groups:
      astro-dependencies:
        patterns:
          - 'astro'
          - '@astrojs/*'
      react-dependencies:
        patterns:
          - 'react*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
